<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030303">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gigawatt">
<title>Gigawatt — Playing</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/crypt.css?v=2.2.43">
<link rel="stylesheet" href="/skin.css" id="skin-css">
</head>
<body class="playing-page">
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Gigawatt</h1>
      <div class="sub">S2 · V2.2.43</div>
    </div>
    <div class="top-end">
      <div class="hostline" id="hostline">Connecting…</div>
      <a class="setlink" href="/settings" aria-label="Settings" title="Settings"><span></span><span></span><span></span></a>
    </div>
  </header>
  <main class="page">
    <section class="card nowcard">
      <div class="viz-wrap" id="vizwrap">
        <div class="cover-fallback" id="fallback" aria-hidden="true"></div>
        <img id="coverart" alt="">
      </div>
      <div class="now-block">
        <div class="now-line">
          <span class="live-dot" id="state" aria-label="Idle"></span>
          <div class="now" id="now">Nothing playing</div>
        </div>
        <div class="now-artist" id="nowartist">Pick a track in Library</div>
      </div>
      <div class="seek-row">
        <span class="seek-t" id="tcur">0:00</span>
        <input id="seekbar" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
        <span class="seek-t" id="tdur">0:00</span>
      </div>
      <div class="transport">
        <button class="icon" id="prevbtn" type="button" aria-label="Previous">⟨⟨</button>
        <button class="playbig primary" id="playbtn" type="button" aria-label="Play">
          <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <button class="icon" id="nextbtn" type="button" aria-label="Next">⟩⟩</button>
      </div>
      <div class="vol">Volume <input id="vol" type="range" min="0" max="100" value="100"></div>
      <div class="row center">
        <button class="ghost stop-inline" id="stopbtn" type="button">Stop</button>
      </div>
      <div class="err" id="err"></div>
    </section>
    <section class="card queue-card">
      <div class="section-head">
        <h2>Up next</h2>
        <span class="meta tight" id="qmeta"></span>
      </div>
      <ol class="queue" id="queue"></ol>
      <a class="morelink" id="qmore" href="/library" hidden></a>
    </section>
  </main>
  <nav class="tabbar">
    <a class="on" href="/">Playing</a>
    <a href="/library">Library</a>
    <a href="/karaoke">Karaoke</a>
    <a href="/report">Report</a>
  </nav>
</div>
<script>
const $ = (id) => document.getElementById(id);
let last = {};
let lastAt = 0;
let seekUser = false;
let volUser = false;
let volPending = null;
let volBusy = false;
let tickBusy = false;

function fmt(sec) {
  sec = Math.max(0, sec || 0);
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
  }[c]));
}
function titleOf(name) {
  return String(name || "").replace(/\.[^.]+$/, "").replace(/[_]+/g, " ");
}
async function api(path, body) {
  const opt = body === undefined ? { method: "POST" } : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  };
  const r = await fetch(path, opt);
  return r.json();
}
function posNow() {
  const p = last.player || {};
  const base = p.position || 0;
  const dur = p.duration || 0;
  if (!p.playing) return Math.min(dur || base, base);
  const t = base + (Date.now() - lastAt) / 1000;
  return dur ? Math.min(dur, t) : t;
}
function paintSeek() {
  const p = last.player || {};
  const dur = p.duration || 0;
  const pos = posNow();
  $("tcur").textContent = fmt(pos);
  $("tdur").textContent = fmt(dur);
  if (!seekUser) {
    $("seekbar").value = dur > 0 ? String(Math.round((pos / dur) * 1000)) : "0";
  }
}
function showCover(st, name) {
  const wrap = $("vizwrap");
  const img = $("coverart");
  const fb = $("fallback");
  const cover = st.cover || {};
  if (name && cover.found && cover.url && (!cover.name || cover.name === name)) {
    wrap.classList.add("has-cover");
    img.removeAttribute("hidden");
    if (img.getAttribute("src") !== cover.url) img.src = cover.url;
    fb.textContent = "";
    return;
  }
  wrap.classList.remove("has-cover");
  img.removeAttribute("src");
  img.setAttribute("hidden", "");
  const letter = (st.player && (st.player.artist || st.player.title || st.player.name) || "?").trim().charAt(0).toUpperCase();
  fb.textContent = name ? letter : "";
}

function renderQueue(st) {
  const ul = $("queue");
  ul.innerHTML = "";
  const items = st.queue || [];
  const total = st.queue_total || 0;
  $("qmeta").textContent = total ? Math.min(items.length, 8) + " of " + total : "";
  if (!items.length) {
    const li = document.createElement("li");
    li.className = "empty empty-state";
    li.innerHTML = (st.count || 0)
      ? "<span class='empty-title'>End of the queue</span><span class='empty-detail'>Open Library to play more.</span>"
      : "<span class='empty-title'>Nothing queued</span><span class='empty-detail'>Open Library to play a track.</span>";
    ul.appendChild(li);
    $("qmore").hidden = true;
    return;
  }
  items.slice(0, 8).forEach((t, i) => {
    const li = document.createElement("li");
    li.innerHTML =
      "<span class='idx'>" + (i + 1) + "</span>" +
      "<span class='name'>" + esc(t.title || titleOf(t.name)) +
      (t.artist ? "<span class='qby'>" + esc(t.artist) + "</span>" : "") + "</span>";
    li.onclick = () => playName(t.name, t.origin);
    ul.appendChild(li);
  });
  $("qmore").hidden = total <= items.length;
  if (total > items.length) $("qmore").textContent = (total - items.length) + " more in Library →";
}

async function tick() {
  if (tickBusy) return;
  tickBusy = true;
  try {
    const st = await (await fetch("/api/status", { cache: "no-store" })).json();
    last = st;
    lastAt = Date.now();
    const p = st.player || {};
    const ap = st.airplay || {};
    const apOn = !!ap.active;
    const playing = !!p.playing || apOn;
    const paused = !!p.paused && !apOn;
    const name = p.name || "";
    if (apOn) $("hostline").textContent = "AirPlay · " + (ap.name || "host");
    else if ((st.output || "jack") === "browser") $("hostline").textContent = (st.model || "SHR-S2") + " · this browser";
    else $("hostline").textContent = (st.model || "SHR-S2") + " · TOSLINK";
    const sub = document.querySelector(".brand .sub");
    if (sub && st.version) sub.textContent = "S2 · V" + st.version;
    if (apOn) {
      $("now").textContent = ap.title || "AirPlay";
      $("nowartist").textContent = ap.artist || ap.client || "AirPlay";
    } else if (name || p.title || playing) {
      $("now").textContent = p.title || titleOf(name) || "Playing";
      $("nowartist").textContent = p.artist || "Unknown artist";
    } else {
      $("now").textContent = "Nothing playing";
      $("nowartist").textContent = "Pick a track in Library";
    }
    $("playbtn").classList.toggle("is-playing", playing);
    $("playbtn").setAttribute("aria-label", playing ? "Pause" : "Play");
    const badge = $("state");
    badge.className = "live-dot " + (playing ? "live" : paused ? "seen" : "dead");
    badge.setAttribute("aria-label", playing ? "Playing" : paused ? "Paused" : "Idle");
    $("vizwrap").classList.toggle("live", playing);
    document.body.classList.toggle("is-playing", playing);
    if (!volUser) $("vol").value = st.volume == null ? 100 : st.volume;
    $("err").textContent = p.error || "";
    $("seekbar").disabled = !name || apOn || !(p.duration > 0);
    paintSeek();
    showCover(st, apOn ? "" : name);
    renderQueue(st);
  } catch (e) {
    $("err").textContent = "Host is not answering";
  } finally {
    tickBusy = false;
  }
}

async function toggle() {
  const p = last.player || {};
  if (p.playing) await api("/api/pause");
  else if (p.paused) await api("/api/resume");
  else if (p.name) await api("/api/play", { name: p.name, origin: p.origin || "local" });
  else if ((last.queue || [])[0]) await api("/api/next");
  tick();
}
async function playName(name, origin) {
  await api("/api/play", { name: name, origin: origin || "local" });
  tick();
}
$("prevbtn").onclick = async () => { await api("/api/prev"); tick(); };
$("nextbtn").onclick = async () => { await api("/api/next"); tick(); };
$("stopbtn").onclick = async () => { await api("/api/stop"); tick(); };
$("playbtn").onclick = toggle;
$("coverart").onclick = toggle;
$("fallback").onclick = toggle;

$("vol").addEventListener("input", (e) => {
  const n = Math.max(0, Math.min(100, Number(e.target.value)));
  volPending = n;
  if (volBusy) return;
  volBusy = true;
  api("/api/volume", { n: n }).finally(() => {
    volBusy = false;
    if (volPending != null && volPending !== n) {
      const m = volPending;
      volPending = null;
      volBusy = true;
      api("/api/volume", { n: m }).finally(() => { volBusy = false; });
    } else volPending = null;
  });
});
$("vol").addEventListener("pointerdown", () => { volUser = true; });
$("vol").addEventListener("pointerup", () => { volUser = false; });
$("vol").addEventListener("pointercancel", () => { volUser = false; });

$("seekbar").addEventListener("pointerdown", () => { seekUser = true; });
$("seekbar").addEventListener("pointerup", () => { seekUser = false; });
$("seekbar").addEventListener("pointercancel", () => { seekUser = false; });
$("seekbar").addEventListener("change", async (e) => {
  const p = last.player || {};
  const dur = p.duration || 0;
  if (!dur) return;
  const t = (Number(e.target.value) / 1000) * dur;
  seekUser = false;
  await api("/api/seek", { seconds: t });
  tick();
});

tick();
setInterval(tick, 1000);
setInterval(paintSeek, 250);
</script>
</body>
</html>
