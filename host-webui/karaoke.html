<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030303">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gigawatt">
<title>Gigawatt — Karaoke</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/crypt.css">
<link rel="stylesheet" href="/skin.css" id="skin-css">
</head>
<body class="karaoke-page">
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Gigawatt</h1>
      <div class="sub">Karaoke</div>
    </div>
    <div class="top-end">
      <div class="hostline" id="hostline">TOSLINK · lyrics</div>
      <a class="setlink" href="/settings" aria-label="Settings" title="Settings"><span></span><span></span><span></span></a>
    </div>
  </header>
  <main class="page">
    <section class="card kara-card">
      <div class="kara-now-row">
        <div class="kara-art" id="kara-art" aria-hidden="true"></div>
        <div class="kara-now-meta">
          <div class="section-head">
            <h2 id="kara-title">Nothing playing</h2>
            <span class="badge" id="state">Idle</span>
          </div>
          <div class="meta" id="kara-artist"></div>
          <div class="kara-chip hidden" id="kara-by"></div>
        </div>
      </div>
      <div class="kara-stage" id="stage" role="button" tabindex="0" title="Tap to play or pause">
        <div class="kara-prev" id="prev"></div>
        <div class="kara-now" id="now">Tap to start · lyrics follow this TOSLINK</div>
        <div class="kara-next" id="next"></div>
      </div>
      <div class="kara-bar" id="kbar" hidden>
        <div class="kara-bar-fill" id="kfill"></div>
      </div>
      <div class="kara-tools">
        <span class="kara-src" id="src">No lyrics</span>
        <span class="kara-time" id="ktime">0:00 / 0:00</span>
      </div>
      <div class="row center kara-actions">
        <button class="icon" type="button" id="prevbtn" aria-label="Previous">⟨⟨</button>
        <button class="playbig primary" id="playbtn" type="button" aria-label="Play">
          <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <button class="icon" type="button" id="nextbtn" aria-label="Next">⟩⟩</button>
      </div>
      <div class="row center">
        <button class="ghost" id="fetchbtn" type="button">Fetch lyrics</button>
      </div>
      <div class="err" id="err"></div>
    </section>
    <section class="kara-split">
      <div class="card kara-pane">
        <div class="section-head">
          <h2>Queue</h2>
          <span class="meta tight" id="qmeta"></span>
        </div>
        <ol class="queue kara-queue" id="queue"></ol>
      </div>
      <div class="card kara-pane">
        <div class="section-head">
          <h2>Library</h2>
          <span class="meta tight" id="libmeta"></span>
        </div>
        <p class="hint">Search, then Play next. Your name shows on the queue.</p>
        <input class="search" id="req-name" type="text" maxlength="32" placeholder="Your name" autocomplete="name">
        <input class="search" id="filter" type="search" placeholder="Search the library" autocomplete="off">
        <ul class="tracks kara-lib" id="lib"></ul>
      </div>
    </section>
  </main>
  <div class="kara-toast hidden" id="toast" role="status"></div>
  <nav class="tabbar">
    <a href="/">Playing</a>
    <a href="/library">Library</a>
    <a class="on" href="/karaoke">Karaoke</a>
    <a href="/report">Report</a>
  </nav>
</div>
<script>
const $ = (id) => document.getElementById(id);
const NAME_KEY = "gigawatt-karaoke-name";
let last = {};
let catalog = [];
let lyric = { name: "", lines: [], synced: false, source: "" };
let playClock = { at: 0, heard: 0, playing: false, duration: 0, name: "" };
let raf = 0;
let toastTimer = 0;

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}
function titleOf(t) {
  if (t && t.title) return t.title;
  return String((t && t.name) || t || "").replace(/\.[^.]+$/, "").replace(/[_]+/g, " ");
}
function fmt(sec) {
  sec = Math.max(0, sec || 0);
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add("hidden"), 2400);
}
async function api(path, body) {
  const opt = body === undefined ? { method: "POST" } : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  };
  const r = await fetch(path, opt);
  return r.json();
}
function nowHeard() {
  const base = playClock.heard || 0;
  if (!playClock.playing) return base;
  const p = base + (performance.now() - playClock.at) / 1000;
  return Math.max(0, Math.min(playClock.duration || p, p));
}
function lineAt(t) {
  const rows = lyric.lines || [];
  let idx = -1;
  for (let i = 0; i < rows.length; i++) {
    if ((rows[i].t || 0) <= t) idx = i;
    else break;
  }
  return idx;
}
function wordAt(words, t) {
  let idx = -1;
  for (let i = 0; i < words.length; i++) {
    if ((words[i].t || 0) <= t) idx = i;
    else break;
  }
  return idx;
}
function splitWords(line, nextT) {
  if (line.words && line.words.length) return line.words;
  const text = line.text || "";
  const tokens = text.match(/\S+\s*/g) || (text ? [text] : []);
  const t0 = line.t || 0;
  let t1 = (nextT != null && nextT > t0) ? nextT : t0 + Math.max(2, tokens.length * 0.45);
  const span = t1 - t0;
  const n = Math.max(1, tokens.length);
  return tokens.map((tok, k) => ({ t: t0 + span * (k / n), text: tok }));
}
function renderWords(line, t, nextT) {
  if (!line) return "♪";
  const words = splitWords(line, nextT);
  if (!words.length) return esc(line.text || "");
  const wi = wordAt(words, t);
  return words.map((w, i) => {
    const start = w.t || 0;
    const end = (i + 1 < words.length) ? (words[i + 1].t || start) : (nextT != null && nextT > start ? nextT : start + 0.45);
    let cls = "";
    let fill = 0;
    if (i < wi) {
      cls = "sung";
      fill = 100;
    } else if (i === wi) {
      cls = "on";
      fill = end > start ? Math.max(0, Math.min(100, ((t - start) / (end - start)) * 100)) : 100;
    }
    const label = esc(w.text);
    return "<span class='kara-word " + cls + "' style='--fill:" + fill.toFixed(1) + "%'>" + label + "</span>";
  }).join("");
}
function paint() {
  const t = nowHeard();
  const rows = lyric.lines || [];
  const i = lyric.synced ? lineAt(t) : -1;
  const prev = i > 0 ? rows[i - 1] : null;
  const cur = i >= 0 ? rows[i] : null;
  const nxt = i >= 0 ? rows[i + 1] : (rows[0] || null);
  $("prev").textContent = prev ? prev.text : "";
  $("next").textContent = nxt ? nxt.text : "";
  if (!lyric.synced && rows.length) {
    $("now").innerHTML = rows.map((row, n) => "<div class='kara-plain" + (n === 0 ? " on" : "") + "'>" + esc(row.text) + "</div>").join("");
  } else if (!rows.length) {
    $("now").textContent = playClock.name ? "No lyrics yet — fetch or drop a .lrc" : "Tap to start · pick a song below";
  } else {
    const nextT = nxt && i >= 0 ? nxt.t : (playClock.duration || (cur && cur.t + 4) || 0);
    $("now").innerHTML = renderWords(cur, t, nextT);
  }
  const dur = playClock.duration || 0;
  $("ktime").textContent = fmt(t) + " / " + fmt(dur);
  const bar = $("kbar");
  if (dur > 0) {
    bar.hidden = false;
    $("kfill").style.width = Math.min(100, (t / dur) * 100) + "%";
  } else {
    bar.hidden = true;
  }
}
function loop() {
  raf = requestAnimationFrame(loop);
  paint();
}
async function loadLyrics(name, fetchRemote) {
  if (!name) {
    lyric = { name: "", lines: [], synced: false, source: "" };
    $("src").textContent = "No lyrics";
    return;
  }
  let data;
  if (fetchRemote) {
    data = await api("/api/lyrics", {
      name: name,
      fetch: true,
      duration: playClock.duration || 0,
      origin: (last.player || {}).origin || playClock.origin || ""
    });
  } else {
    const origin = (last.player || {}).origin || playClock.origin || "";
    data = await (await fetch("/api/lyrics?name=" + encodeURIComponent(name) + (origin ? ("&origin=" + encodeURIComponent(origin)) : ""))).json();
  }
  lyric = {
    name: name,
    lines: data.lines || [],
    synced: !!data.synced,
    source: data.source || ""
  };
  if (data.ok && lyric.lines.length) {
    $("src").textContent = (data.synced ? "Synced · " : "Text · ") + (data.source || "local");
    $("err").textContent = "";
  } else {
    $("src").textContent = "No lyrics";
    $("err").textContent = data.error && data.error !== "no lyrics" ? data.error : "";
  }
  $("kara-title").textContent = data.title || titleOf(name);
  $("kara-artist").textContent = data.artist || "";
}
async function toggle() {
  const p = (last.player || {});
  if (p.playing) await api("/api/pause");
  else if (p.paused) await api("/api/resume");
  else if (p.name) await api("/api/play", { name: p.name });
  else if ((last.queue || [])[0]) await api("/api/play", { name: last.queue[0].name });
  else if ((last.count || 0) > 0) await api("/api/next");
  tick();
}
function requester() {
  return ($("req-name").value || "").trim();
}
function q() { return ($("filter").value || "").trim().toLowerCase(); }
function hit(t) {
  const s = q();
  if (!s) return true;
  return [t.title, t.artist, t.album, t.name].some((v) => String(v || "").toLowerCase().indexOf(s) >= 0);
}
function renderLib() {
  const ul = $("lib");
  ul.innerHTML = "";
  const rows = catalog.filter(hit);
  $("libmeta").textContent = rows.length ? rows.length + " tracks" : "";
  if (!rows.length) {
    const li = document.createElement("li");
    li.className = "empty empty-state";
    li.innerHTML = "<span class='empty-title'>No matches</span><span class='empty-detail'>Try another search.</span>";
    ul.appendChild(li);
    return;
  }
  rows.slice(0, 80).forEach((t) => {
    const li = document.createElement("li");
    const art = t.cover
      ? "<img class='cover' src='" + esc(t.cover) + "' alt=''>"
      : "<span class='cover'>" + esc((t.artist || t.title || "?").slice(0, 2).toUpperCase()) + "</span>";
    li.innerHTML =
      art +
      "<div class='kara-lib-copy'><div class='name'>" + esc(titleOf(t)) + "</div>" +
      "<div class='meta'>" + esc(t.artist || "Unknown artist") + "</div></div>" +
      "<button type='button' class='ghost kara-add'>Play next</button>";
    li.querySelector(".kara-add").onclick = (ev) => {
      ev.stopPropagation();
      queueTrack(t);
    };
    li.onclick = () => queueTrack(t);
    ul.appendChild(li);
  });
}
async function queueTrack(t) {
  const by = requester();
  const res = await api("/api/queue", { name: t.name, by: by });
  if (!res || res.ok === false) {
    $("err").textContent = (res && res.error) || "Could not queue";
    return;
  }
  const who = by ? (" for " + by) : "";
  toast("Up next: " + titleOf(t) + who);
  $("err").textContent = "";
  tick();
}
function renderQueue(st) {
  const ul = $("queue");
  ul.innerHTML = "";
  const p = st.player || {};
  const items = st.queue || [];
  const total = st.queue_total || 0;
  $("qmeta").textContent = total ? total + " up next" : "";
  const nowName = p.name || "";
  if (nowName) {
    const li = document.createElement("li");
    li.className = "on";
    const by = st.requested_by ? "<span class='qby'>Requested by " + esc(st.requested_by) + "</span>" : "";
    li.innerHTML =
      "<span class='idx'>Now</span>" +
      "<span class='name'>" + esc(titleOf({ name: nowName, title: $("kara-title").textContent })) +
      by + "</span>";
    ul.appendChild(li);
  }
  if (!items.length && !nowName) {
    const li = document.createElement("li");
    li.className = "empty empty-state";
    li.innerHTML = "<span class='empty-title'>Queue is empty</span><span class='empty-detail'>Search the library and tap Play next.</span>";
    ul.appendChild(li);
    return;
  }
  items.forEach((t, i) => {
    const li = document.createElement("li");
    const by = t.requested_by ? "<span class='qby'>Requested by " + esc(t.requested_by) + "</span>" : "";
    li.innerHTML =
      "<span class='idx'>" + (i + 1) + "</span>" +
      "<span class='name'>" + esc(t.title || titleOf(t.name)) + by + "</span>";
    li.onclick = async () => {
      await api("/api/play", { name: t.name });
      tick();
    };
    ul.appendChild(li);
  });
}
function paintNowArt(st) {
  const box = $("kara-art");
  const cover = st.cover || {};
  if (cover.url && cover.found) {
    box.innerHTML = "<img src='" + esc(cover.url) + "' alt=''>";
    box.classList.add("has-img");
  } else {
    box.innerHTML = "";
    box.classList.remove("has-img");
  }
  const chip = $("kara-by");
  if (st.requested_by) {
    chip.textContent = "Requested by " + st.requested_by;
    chip.classList.remove("hidden");
  } else {
    chip.textContent = "";
    chip.classList.add("hidden");
  }
}
$("playbtn").addEventListener("click", toggle);
$("prevbtn").addEventListener("click", async () => { await api("/api/prev"); tick(); });
$("nextbtn").addEventListener("click", async () => { await api("/api/next"); tick(); });
$("stage").addEventListener("click", toggle);
$("stage").addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); }
});
$("fetchbtn").addEventListener("click", async () => {
  const name = playClock.name || (last.player && last.player.name);
  if (!name) { $("err").textContent = "Nothing playing"; return; }
  $("fetchbtn").disabled = true;
  $("src").textContent = "Fetching…";
  try {
    await loadLyrics(name, true);
  } finally {
    $("fetchbtn").disabled = false;
  }
});
$("filter").addEventListener("input", renderLib);
$("req-name").value = localStorage.getItem(NAME_KEY) || "";
$("req-name").addEventListener("change", () => {
  localStorage.setItem(NAME_KEY, requester());
});
let tickBusy = false;
async function tick() {
  if (tickBusy) return;
  tickBusy = true;
  try {
    const st = await (await fetch("/api/status")).json();
    last = st;
    const p = st.player || {};
    const apOn = !!(st.airplay || {}).active;
    const playing = !!p.playing && !apOn;
    const paused = !!p.paused && !apOn;
    playClock = {
      at: performance.now(),
      heard: p.position || 0,
      playing: playing,
      duration: p.duration || 0,
      name: p.name || "",
      origin: p.origin || ""
    };
    $("hostline").textContent = playing ? "TOSLINK · karaoke" : "SHR-S2 · karaoke";
    $("playbtn").classList.toggle("is-playing", playing);
    $("playbtn").setAttribute("aria-label", playing ? "Pause" : "Play");
    const badge = $("state");
    badge.className = "badge " + (playing ? "live" : paused ? "seen" : "dead");
    badge.textContent = playing ? "Live" : paused ? "Paused" : "Idle";
    const qn = new URLSearchParams(location.search).get("name");
    const name = qn || p.name || "";
    if (name && name !== lyric.name) await loadLyrics(name, false);
    if (!name && lyric.name) await loadLyrics("", false);
    if (!name) {
      $("kara-title").textContent = "Nothing playing";
      $("kara-artist").textContent = "";
    }
    paintNowArt(st);
    renderQueue(st);
  } catch (e) {
    $("err").textContent = "Host is not answering";
  } finally {
    tickBusy = false;
  }
}
async function loadCatalog() {
  try {
    const local = await (await fetch("/api/library?local=1")).json();
    if ((local.tracks || []).length) {
      catalog = local.tracks;
      renderLib();
    }
  } catch (e) {}
  try {
    const data = await (await fetch("/api/library")).json();
    catalog = data.tracks || catalog;
    renderLib();
  } catch (e) {}
}
raf = requestAnimationFrame(loop);
tick();
loadCatalog();
setInterval(tick, 1000);
setInterval(loadCatalog, 20000);
let clockBusy = false;
setInterval(async () => {
  if (document.hidden || clockBusy || !playClock.playing || (last.airplay || {}).active) return;
  clockBusy = true;
  try {
    const st = await (await fetch("/api/clock")).json();
    const p = st.player || {};
    playClock.at = performance.now();
    playClock.heard = p.position || 0;
    playClock.playing = !!p.playing;
    playClock.duration = p.duration || playClock.duration;
  } catch (e) {}
  finally { clockBusy = false; }
}, 250);
</script>
</body>
</html>
